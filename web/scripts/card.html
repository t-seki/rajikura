<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:"BIZ UDPGothic",sans-serif;font-weight:700;background:#0A2540;color:#E8F1FB;background-image:linear-gradient(rgba(207,227,247,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(207,227,247,.07) 1px,transparent 1px);background-size:30px 30px}
.brand{position:absolute;left:64px;top:96px;display:flex;align-items:center;gap:20px;line-height:1;font-size:66px}

.block{position:absolute;left:64px;bottom:50px;display:flex;border:3px solid #CFE3F7;font-size:26px;line-height:1;background:#0A2540;white-space:nowrap}
.block div{padding:17px 16px}.block div+div{border-left:3px solid #CFE3F7}
.block .b{color:#8CC8FF}
.stack{position:absolute;left:832px;top:120px;width:720px;height:450px;transform:rotate(-5deg);transform-origin:left top}
.stack img{position:absolute;width:720px;height:450px;border:3px solid #CFE3F7;border-radius:14px;background:#fff;box-shadow:0 22px 50px rgba(0,8,20,.55)}
.stack img:nth-child(1){left:110px;top:-108px}
.stack img:nth-child(2){left:55px;top:-40px}
.stack img:nth-child(3){left:0;top:32px;object-fit:none;object-position:-208px -60px}
</style></head><body>
<div class="stack"><img src="../../docs/images/shows.png" alt=""><img src="../../docs/images/jobs.png" alt=""><img src="../../docs/images/guide.png" alt=""></div>

</body></html>
